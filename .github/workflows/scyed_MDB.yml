name: scyed

on:
  # schedule:
  #   - cron: "59 21 * * *"
  workflow_dispatch:

env:
  SCRIPT_NAME: pterodactyl_web
  COOKIE_NAME: Scyed
  API_SCRIPT: github_api.sh

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: [SCYED_ACCOUNTS]
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v3

      - name: Setup proxy and verify connection
        run: |
          # 设置代理
          bash <(curl -Ls ${{ secrets.PROXY_MDB }})
          
          # 检测代理连接
          curl -I --socks5 ${{ secrets.SOCKS5_PROXY }} https://google.com
      
      - name: Generate requirements file
        run: echo "${{ secrets.CHROME_DEPS }}" > requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: |
          pip install -r requirements.txt -q >/dev/null 2>&1
      
      - name: Install Chrome for Testing and set CHROMEPATH
        run: |
          npx @puppeteer/browsers install chrome@stable
          CHROMEPATH=$(find ./chrome -type f -name chrome | grep chrome-linux64/chrome | sort | tail -n 1)
          if [ -z "$CHROMEPATH" ]; then
            echo "❌ Chrome executable not found!"
            exit 1
          fi
          echo "CHROMEPATH=$CHROMEPATH" >> $GITHUB_ENV

      - name: Download script and cookies from private repo
        run: |
          # 加载 GitHub API 函数
          source scripts/${{ env.API_SCRIPT }}
          
          # 下载主脚本
          download_file "${{ env.SCRIPT_NAME }}.py" "${{ env.SCRIPT_NAME }}.py" "${{ secrets.ACCESS_TOKEN }}" "${{ secrets.PRIVATE_REPO_OWNER }}" "${{ secrets.PRIVATE_REPO_NAME }}"
          
          # 检查下载是否成功
          if [ -f "${{ env.SCRIPT_NAME }}.py" ]; then
            echo "Script file ${{ env.SCRIPT_NAME }}.py downloaded successfully"
          else
            echo "Failed to download script file ${{ env.SCRIPT_NAME }}.py"
          fi
          
          # 创建 tmp 目录
          mkdir -p tmp
          
          # 获取并下载 cookie 文件
          get_file_list "tmp" "${{ secrets.ACCESS_TOKEN }}" "${{ secrets.PRIVATE_REPO_OWNER }}" "${{ secrets.PRIVATE_REPO_NAME }}" "${{ env.COOKIE_NAME }}.*json" | \
          while read file_path; do
            if [ ! -z "$file_path" ]; then
              download_file "$file_path" "tmp/$(basename $file_path)" "${{ secrets.ACCESS_TOKEN }}" "${{ secrets.PRIVATE_REPO_OWNER }}" "${{ secrets.PRIVATE_REPO_NAME }}"
            fi
          done

      - name: Run python script
        run: python3 ${{ env.SCRIPT_NAME }}.py
        env:
          CHROMEPATH: ${{ env.CHROMEPATH }}
          ACCOUNT_SECRET: ${{ secrets[matrix.account] }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}

      - name: Upload updated cookies to private repo
        run: |
          # 加载 GitHub API 函数
          source scripts/${{ env.API_SCRIPT }}
          
          # 上传更新的文件
          if [ -d "tmp" ] && [ "$(ls -A tmp)" ]; then
            for file in tmp/*.json; do
              if [ -f "$file" ]; then
                upload_file "$file" "tmp/$(basename $file)" "${{ secrets.ACCESS_TOKEN }}" "${{ secrets.PRIVATE_REPO_OWNER }}" "${{ secrets.PRIVATE_REPO_NAME }}"
              fi
            done
            echo "Successfully uploaded updated cookies to private repo"
          else
            echo "No files to upload"
          fi
